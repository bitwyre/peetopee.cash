name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Never let two production deploys run at once.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Typecheck, test & build web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    name: Deploy over SSH
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to droplet
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DROPLET_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes "root@${DROPLET_HOST}" '
            set -e
            cd /opt/peetopee
            git pull --ff-only origin main
            git log -1 --oneline
            docker compose build
            docker compose up -d
            docker image prune -f
          '
      - name: Smoke-check the site
        run: |
          sleep 5
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 https://peetopee.cash/)
          echo "GET / -> $code"
          test "$code" = "200"
