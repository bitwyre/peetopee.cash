name: Deploy to production

# Push-to-main only (no pull_request trigger) — required because this runs on a
# self-hosted runner on the production droplet: fork PRs must never execute here.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Never let two production deploys run at once.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, deploy & restart
    runs-on: [self-hosted, linux]
    steps:
      # No actions/checkout — we operate directly on the live checkout at /opt/peetopee.
      - name: Pull, build, restart
        run: |
          set -euo pipefail
          cd /opt/peetopee
          git fetch --prune origin main
          git reset --hard origin/main
          git log -1 --oneline
          # `docker compose build` is the gate: if the web/api build fails, set -e
          # aborts here and the running containers are left untouched.
          docker compose build
          docker compose up -d
          docker image prune -f

      - name: Smoke-check the site
        run: |
          sleep 5
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 https://peetopee.cash/)
          echo "GET / -> $code"
          test "$code" = "200"
